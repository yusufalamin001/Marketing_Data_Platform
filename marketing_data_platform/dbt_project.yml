name: 'marketing_data_platform'
version: '1.0.0'

profile: 'marketing_data_platform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Days the incremental fact reloads on every run, so platform restatements
  # overwrite the old rows. Tune it: longer is safer, shorter is cheaper.
  lookback_days: 3

models:
  marketing_data_platform:
    # Staging: one model per raw table, light cleaning only.
    # Views are cheap, always read fresh raw data and store nothing extra.
    staging:
      +materialized: view

    intermediate:
      # Per-platform joins feed exactly one model (int_marketing_ads), so
      # nothing needs to be stored. Ephemeral inlines them as CTEs.
      facebook:
        +materialized: ephemeral
      snapchat:
        +materialized: ephemeral
      # The unified model is queried and tested directly, so it is a view.
      marketing:
        +materialized: view

    # Marts: what analysts, BI tools and the AI agent query.
    marts:
      # Facts grow daily. The strategy (merge) and unique key are set in the
      # model itself because they are specific to that model.
      fact:
        +materialized: incremental
      # Dimensions are small and rebuilt in full, so names are always current.
      dim:
        +materialized: table
      # The consumption view stores nothing and joins on read, so it can
      # never serve stale names.
      reporting:
        +materialized: view