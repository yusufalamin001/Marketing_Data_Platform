version: 2

models:
  - name: int_marketing_ads
    description: >
      Facebook and Snapchat ad performance in one shape. Grain: one row per
      platform per ad per day. Snapchat country rows are summed to match
      Facebook. Spend is in currency_code and must not be summed across
      currencies. Missing clicks and impressions stay null.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, ad_id, report_date]
    columns:
      - name: platform
        description: Source advertising platform.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['facebook', 'snapchat']
      - name: report_date
        description: Calendar day the performance applies to.
        data_tests: [not_null]
      - name: account_id
        description: Ad account that owns the campaign, as a string.
        data_tests: [not_null]
      - name: currency_code
        description: ISO currency of the spend. Facebook takes it from the account, Snapchat from the stats.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['EUR', 'USD']
      - name: campaign_id
        description: Campaign identifier, as a string.
        data_tests: [not_null]
      - name: campaign_name
        description: Campaign name as set in the platform.
        data_tests: [not_null]
      - name: ad_group_id
        description: Ad group (Facebook ad set) identifier.
      - name: ad_group_name
        description: Ad group name as set in the platform.
      - name: ad_id
        description: Ad identifier, as a string.
        data_tests: [not_null]
      - name: ad_name
        description: Ad name as set in the platform.
      - name: spend
        description: Amount spent that day, in currency_code, to 6 decimals.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: impressions
        description: Times the ad was shown. Null when the source has no value.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: clicks
        description: Clicks recorded. Null when the source has no value.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0