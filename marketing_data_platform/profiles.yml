marketing_data_platform:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"

  meta:
    base: &base
      type: databricks
      threads: 8
    base_auth: &base_auth
      type: databricks
      auth_type: oauth
      client_id: "{{ env_var('DBX_ID_APPLICATION_ID') }}"
      client_secret: "{{ env_var('DBX_SECRET') }}"
      threads: 8
      # Retries when the warehouse is starting up. Defaults to 30. CI sets a low
      # value through DBT_CONNECT_RETRIES so a broken secret fails fast.
      connect_retries: "{{ env_var('DBT_CONNECT_RETRIES', 30) | as_number }}"
      retry_all: true

  outputs:
    # Local development. Acts as the developer, using a personal access token.
    # Never used for anything automated.
    dev: &dev_personal
      <<: *base
      host: dbc-9c464fce-09e0.cloud.databricks.com
      token: "{{ env_var('DATABRICKS_PAT_TOKEN') }}"
      catalog: "{{ env_var('DEV_CATALOG') }}"
      schema: "{{ env_var('DEV_SCHEMA') }}"
      http_path: /sql/1.0/warehouses/911b191e1ab1578c

    # Pull request validation. Acts as the service principal. DEV_SCHEMA is set
    # per pull request in CI, so two pull requests never collide.
    ci: &ci_service_account
      <<: *base_auth
      host: dbc-9c464fce-09e0.cloud.databricks.com
      http_path: /sql/1.0/warehouses/911b191e1ab1578c
      catalog: ci_development
      schema: "{{ env_var('DEV_SCHEMA') }}"

    # Dress rehearsal of production. Marts land in gold_staging, and the
    # custom database macro sends staging and intermediate models to
    # silver_staging.
    staging: &staging_service_account
      <<: *base_auth
      host: dbc-9c464fce-09e0.cloud.databricks.com
      http_path: /sql/1.0/warehouses/911b191e1ab1578c
      catalog: gold_staging
      schema: analytics

    # What consumers read. Marts land in gold_production, and the custom
    # database macro sends staging and intermediate models to silver_production.
    production: &production_service_account
      <<: *base_auth
      host: dbc-9c464fce-09e0.cloud.databricks.com
      http_path: /sql/1.0/warehouses/911b191e1ab1578c
      catalog: gold_production
      schema: analytics


## DATABRICKS ##
## By default, edr expects the profile name 'elementary'.      ##
## Configure the database and schema of elementary models.     ##
## Check where 'elementary_test_results' is to find it.        ##
## Used by the edr command line tool only. Pass --profile-target.

elementary:
  outputs:
    dev:
      <<: *dev_personal
      catalog: "{{ env_var('DEV_CATALOG') }}"
      schema: "{{ env_var('DEV_SCHEMA') }}_elementary"

    production:
      <<: *production_service_account
      catalog: silver_production
      schema: elementary

    staging:
      <<: *staging_service_account
      catalog: silver_staging
      schema: elementary