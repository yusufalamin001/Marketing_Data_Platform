name: dbt deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deployments queue instead of cancelling each other.
concurrency:
  group: dbt-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    defaults:
      run:
        working-directory: marketing_data_platform
    env:
      DBT_TARGET: staging
      DBX_ID_APPLICATION_ID: ${{ secrets.DBX_ID_APPLICATION_ID }}
      DBX_SECRET: ${{ secrets.DBX_SECRET }}
      DBT_CONNECT_RETRIES: 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run dbt deps
      - name: Build and test in staging
        run: uv run dbt build

  production:
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: marketing_data_platform
    env:
      DBT_TARGET: production
      DBX_ID_APPLICATION_ID: ${{ secrets.DBX_ID_APPLICATION_ID }}
      DBX_SECRET: ${{ secrets.DBX_SECRET }}
      DBT_CONNECT_RETRIES: 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run dbt deps
      - name: Build and test in production
        run: uv run dbt build
      - name: Generate the dbt documentation
        run: uv run dbt docs generate --static
      - name: Keep the documentation
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: marketing_data_platform/target/static_index.html